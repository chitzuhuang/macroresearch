name: Post-market snapshot

on:
  schedule:
    # 08:00 UTC = 16:00 Asia/Taipei, weekdays — about 2.5h after the 13:30
    # close. fetch_market_snapshot.py now reads TWSE's own same-day site
    # (rwd/MI_INDEX) for the full market table and TAIEX instead of the
    # openapi.twse.com.tw mirror, which doesn't finalize a session until the
    # small hours of the next day. By 16:00, that same-day source plus T86
    # (三大法人), TAIFEX futures, and TPEx's quotes/index/flows are all
    # normally published, so one run picks up every source at its same-day
    # version without waiting until the next morning.
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official-latest market snapshot
        run: |
          python3 scripts/fetch_market_snapshot.py --output state/postmarket.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/postmarket.json
          if git diff --cached --quiet; then
            echo "No change in postmarket.json, skipping commit."
          else
            git commit -m "盤後快照更新 $(date -u +%Y-%m-%d)"
            git push
          fi
