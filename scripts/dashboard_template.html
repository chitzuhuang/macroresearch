<title>台股觀測站</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #e3e8f1;
    --text: #10131c;
    --text-muted: #56607a;
    --border: #d6dce8;
    --accent: #1c4e9c;
    --accent-soft: #dde6f6;
    --up: #c23b30;
    --down: #2f8f5b;
    --flat: #8891a6;
    --shadow: 0 1px 2px rgba(16, 19, 28, 0.06), 0 6px 20px rgba(16, 19, 28, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0d14;
      --surface: #11151f;
      --surface-2: #1a2030;
      --text: #e7eaf2;
      --text-muted: #98a2ba;
      --border: #262c3e;
      --accent: #6a9cf5;
      --accent-soft: #182644;
      --up: #ff6f5a;
      --down: #52c98a;
      --flat: #6b7690;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0d14;
    --surface: #11151f;
    --surface-2: #1a2030;
    --text: #e7eaf2;
    --text-muted: #98a2ba;
    --border: #262c3e;
    --accent: #6a9cf5;
    --accent-soft: #182644;
    --up: #ff6f5a;
    --down: #52c98a;
    --flat: #6b7690;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "Heiti TC", "PingFang TC", sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 4rem;
  }
  .num { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  /* Masthead */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
    margin-bottom: 1.75rem;
  }
  .masthead h1 {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-weight: 700;
    font-size: 1.9rem;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  .masthead .date {
    font-family: "IBM Plex Mono", monospace;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  section { margin-bottom: 2.5rem; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.9rem;
    flex-wrap: wrap;
  }
  .section-head h2 {
    font-family: "Noto Serif TC", serif;
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .section-head .updated {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-family: "IBM Plex Mono", monospace;
  }
  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  /* Pre-market */
  .headline {
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    font-size: 1.02rem;
    font-weight: 500;
    margin-bottom: 1rem;
    text-wrap: balance;
  }
  .brief-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .brief-item {
    display: grid;
    grid-template-columns: 4.2rem 1fr;
    gap: 0.75rem;
    padding: 0.7rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .brief-tag {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
    align-self: start;
  }
  .brief-body p { margin: 0 0 0.3rem; }
  .brief-src { font-size: 0.76rem; color: var(--text-muted); }
  .brief-src a { color: inherit; }

  /* Index cards */
  .idx-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .idx-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.95rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .idx-name { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
  .idx-close { font-size: 1.6rem; font-weight: 600; }
  .idx-delta { font-size: 0.92rem; margin-top: 0.15rem; }
  .idx-extra { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }

  /* Breadth */
  .breadth-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 0.9rem;
    margin-bottom: 1.25rem;
  }
  .breadth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .breadth-card h3 { margin: 0 0 0.6rem; font-size: 0.95rem; font-family: "Noto Serif TC", serif; }
  .breadth-bar {
    display: flex;
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface-2);
    margin-bottom: 0.55rem;
  }
  .breadth-bar span { height: 100%; }
  .breadth-legend {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .breadth-legend b.num { font-weight: 600; }
  .breadth-turnover {
    margin-top: 0.6rem;
    font-size: 0.82rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }

  /* Tables */
  .table-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem 0.5rem;
    box-shadow: var(--shadow);
  }
  .table-card h3 {
    margin: 0 0 0.6rem;
    font-size: 0.92rem;
    font-family: "Noto Serif TC", serif;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { text-align: right; padding: 0.35rem 0.3rem; }
  th:first-child, td:first-child { text-align: left; }
  th {
    font-weight: 500;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
  }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  td.name { color: var(--text-muted); font-size: 0.8rem; }

  /* Holdings */
  .holdings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .holdings-empty { color: var(--text-muted); font-style: italic; margin: 0; }
  .holdings-note { color: var(--text-muted); font-size: 0.75rem; margin: 0 0 0.6rem; }
  .holdings-summary {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.9rem;
    padding-bottom: 0.9rem;
    border-bottom: 1px solid var(--border);
  }
  .holdings-stat { font-size: 0.8rem; color: var(--text-muted); }
  .holdings-stat b { display: block; font-size: 1.15rem; color: var(--text); margin-top: 0.15rem; }

  /* Deep research report (server-rendered from Markdown) */
  .report-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem 1.75rem;
    box-shadow: var(--shadow);
    max-width: 100%;
  }
  .report-content h1 {
    font-family: "Noto Serif TC", serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 1rem;
    text-wrap: balance;
  }
  .report-content h2 {
    font-family: "Noto Serif TC", serif;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 1.8rem 0 0.7rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
  }
  .report-content h2:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .report-content h3 { font-size: 1rem; font-weight: 700; margin: 1.2rem 0 0.5rem; }
  .report-content p { margin: 0 0 0.9rem; }
  .report-content ul, .report-content ol { margin: 0 0 1rem; padding-left: 1.4rem; }
  .report-content li { margin-bottom: 0.65rem; }
  .report-content li:last-child { margin-bottom: 0; }
  .report-content hr { display: none; }
  .report-content code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: var(--surface-2);
    border-radius: 4px;
    padding: 0.1em 0.35em;
    font-size: 0.9em;
  }
  .report-content a { color: var(--accent); }
  .report-content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    margin: 0 0 1.1rem;
  }
  .report-content th, .report-content td {
    text-align: left;
    padding: 0.45rem 0.7rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  .report-content th {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.75rem;
  }
  .report-content tbody tr:nth-child(odd) { background: var(--surface-2); }
  .report-empty { color: var(--text-muted); font-style: italic; }

  footer {
    border-top: 1px solid var(--border);
    padding-top: 1.1rem;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  footer .disclaimer { margin-top: 0.5rem; }
  footer a { color: var(--accent); }

  @media (max-width: 640px) {
    .report-content { padding: 1.1rem 1rem; }
    .report-content table { font-size: 0.76rem; }
    .report-content th, .report-content td { padding: 0.35rem 0.45rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .idx-card, .brief-item, .breadth-card, .table-card, .holdings-card { transition: box-shadow 0.15s ease; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <h1>台股觀測站</h1>
    <div class="date" id="masthead-date"></div>
  </div>

  <section id="premarket-section">
    <div class="section-head">
      <h2><span class="eyebrow">盤前</span>&nbsp;總經與新聞摘要</h2>
      <span class="updated" id="premarket-updated"></span>
    </div>
    <div class="headline" id="premarket-headline"></div>
    <div class="brief-list" id="premarket-list"></div>
  </section>

  <section id="postmarket-section">
    <div class="section-head">
      <h2><span class="eyebrow">盤後</span>&nbsp;市場快照</h2>
      <span class="updated" id="postmarket-updated"></span>
    </div>
    <div class="idx-row" id="idx-row"></div>
    <div class="breadth-grid" id="breadth-grid"></div>
    <div class="table-grid" id="table-grid"></div>
  </section>

  <section id="holdings-section">
    <div class="section-head">
      <h2><span class="eyebrow">我的持股</span>&nbsp;損益概況</h2>
      <span class="updated" id="holdings-updated"></span>
    </div>
    <div class="holdings-card" id="holdings-card"></div>
  </section>

  <section id="report-section">
    <div class="section-head">
      <h2><span class="eyebrow">深度研究</span>&nbsp;<span id="report-title">完整研究報告</span></h2>
      <span class="updated" id="report-updated"></span>
    </div>
    <div class="report-content" id="report-content">__REPORT_HTML__</div>
  </section>

  <footer>
    <div>資料來源：TWSE OpenAPI／rwd、TPEx OpenAPI、TAIFEX、經濟部統計處、行政院、央行、金管會、Federal Reserve、Bloomberg、CNBC 等（各項目詳見盤前摘要之來源連結）。盤後市場數據透過 <code>scripts/fetch_market_snapshot.py</code> 正規化。</div>
    <div class="disclaimer">本頁僅供一般研究與資訊整理，不是個人化投資建議、招攬或保證。候選標的仍需依投資人目標、風險承受度、價格與最新資訊獨立評估。</div>
  </footer>
</div>

<script type="application/json" id="premarket-data">__PREMARKET_JSON__</script>
<script type="application/json" id="postmarket-data">__POSTMARKET_JSON__</script>
<script type="application/json" id="report-meta-data">__REPORT_META_JSON__</script>
<script type="application/json" id="holdings-data">__HOLDINGS_JSON__</script>
<script>
  const PREMARKET = JSON.parse(document.getElementById("premarket-data").textContent);
  const POSTMARKET = JSON.parse(document.getElementById("postmarket-data").textContent);
  const REPORT_META = JSON.parse(document.getElementById("report-meta-data").textContent);
  const HOLDINGS = JSON.parse(document.getElementById("holdings-data").textContent);

  function fmtInt(n) {
    if (n === null || n === undefined) return "N/A";
    return Math.round(n).toLocaleString("en-US");
  }
  function fmtPct(n) {
    if (n === null || n === undefined) return "N/A";
    const s = n > 0 ? "+" : "";
    return s + n.toFixed(2) + "%";
  }
  function fmtNum(n, d) {
    if (n === null || n === undefined) return "N/A";
    return n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function deltaClass(n) {
    if (n === null || n === undefined || n === 0) return "flat";
    return n > 0 ? "up" : "down";
  }

  // Masthead date
  document.getElementById("masthead-date").textContent =
    (POSTMARKET.as_of_date || "—") + " 台股資料日 · 產生於 " + (PREMARKET.as_of || "");

  // Pre-market section
  document.getElementById("premarket-updated").textContent = "更新於 " + (PREMARKET.as_of || "—");
  document.getElementById("premarket-headline").textContent = PREMARKET.headline || "";
  const list = document.getElementById("premarket-list");
  (PREMARKET.items || []).forEach(function (item) {
    const row = document.createElement("div");
    row.className = "brief-item";
    row.innerHTML =
      '<div class="brief-tag">' + item.category + '</div>' +
      '<div class="brief-body"><p>' + item.text + '</p>' +
      '<div class="brief-src"><a href="' + item.source_url + '" target="_blank" rel="noopener">' +
      item.source_name + '</a> · ' + item.date + '</div></div>';
    list.appendChild(row);
  });

  // Post-market: indices
  document.getElementById("postmarket-updated").textContent =
    "更新於 " + (POSTMARKET.generated_at ? POSTMARKET.generated_at.replace("T", " ").slice(0, 16) : "—");
  const idxRow = document.getElementById("idx-row");
  (POSTMARKET.indices || []).forEach(function (idx) {
    const cls = deltaClass(idx.change);
    const card = document.createElement("div");
    card.className = "idx-card";
    let extra = "";
    if (idx.volume !== undefined && idx.volume !== null) {
      extra = '<div class="idx-extra num">成交量 ' + fmtInt(idx.volume) + ' 口</div>';
    }
    card.innerHTML =
      '<div class="idx-name">' + idx.name + '</div>' +
      '<div class="idx-close num">' + fmtNum(idx.close, 2) + '</div>' +
      '<div class="idx-delta num ' + cls + '">' +
      (idx.change > 0 ? "+" : "") + fmtNum(idx.change, 2) + '　' + fmtPct(idx.change_pct) + '</div>' +
      extra;
    idxRow.appendChild(card);
  });

  // Post-market: breadth
  const breadthGrid = document.getElementById("breadth-grid");
  Object.keys(POSTMARKET.markets || {}).forEach(function (marketName) {
    const m = POSTMARKET.markets[marketName];
    const total = (m.advancers || 0) + (m.decliners || 0) + (m.unchanged || 0) + (m.missing_change || 0);
    const pct = function (n) { return total > 0 ? (n / total * 100) : 0; };
    const card = document.createElement("div");
    card.className = "breadth-card";
    card.innerHTML =
      '<h3>' + marketName + '　' + '<span class="num" style="font-size:0.8rem;color:var(--text-muted)">' + (m.data_date || "") + '</span></h3>' +
      '<div class="breadth-bar">' +
      '<span style="width:' + pct(m.advancers) + '%;background:var(--up)"></span>' +
      '<span style="width:' + pct(m.decliners) + '%;background:var(--down)"></span>' +
      '<span style="width:' + pct(m.unchanged) + '%;background:var(--flat)"></span>' +
      '</div>' +
      '<div class="breadth-legend">' +
      '<span class="up">▲ <b class="num">' + fmtInt(m.advancers) + '</b></span>' +
      '<span class="down">▼ <b class="num">' + fmtInt(m.decliners) + '</b></span>' +
      '<span class="flat">— <b class="num">' + fmtInt(m.unchanged) + '</b></span>' +
      '</div>' +
      '<div class="breadth-turnover">' +
      '<span>普通股 <b class="num">' + fmtInt(m.common_stocks) + '</b> 檔</span>' +
      '<span>成交值 <b class="num">NT$' + fmtInt((m.total_value_twd || 0) / 1e8) + '</b> 億</span>' +
      '</div>';
    breadthGrid.appendChild(card);
  });

  // Post-market: leaderboards (foreign net buy/sell + turnover)
  const tableGrid = document.getElementById("table-grid");
  const flows = POSTMARKET.foreign_flows || { top_buy: [], top_sell: [] };

  function renderFlowCard(title, rows) {
    const card = document.createElement("div");
    card.className = "table-card";
    const rowsHtml = rows.map(function (r) {
      const cls = deltaClass(r.foreign_net_shares);
      return '<tr>' +
        '<td>' + r.code + '<div class="name">' + r.name + '</div></td>' +
        '<td class="num">' + r.market + '</td>' +
        '<td class="num ' + cls + '">' + (r.foreign_net_lots > 0 ? "+" : "") + fmtNum(r.foreign_net_lots, 0) + '</td>' +
        '</tr>';
    }).join("");
    card.innerHTML =
      '<h3>' + title + '</h3>' +
      '<table><thead><tr><th>代號／名稱</th><th>市場</th><th>買賣超(張)</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table>';
    return card;
  }

  tableGrid.appendChild(renderFlowCard("外資買超前十", flows.top_buy || []));
  tableGrid.appendChild(renderFlowCard("外資賣超前十", flows.top_sell || []));

  const turnoverRows = [];
  Object.keys(POSTMARKET.markets || {}).forEach(function (marketName) {
    (POSTMARKET.markets[marketName].top_turnover || []).forEach(function (r) {
      turnoverRows.push(Object.assign({ mkt: marketName }, r));
    });
  });
  turnoverRows.sort(function (a, b) { return (b.value_twd || 0) - (a.value_twd || 0); });
  const turnoverCard = document.createElement("div");
  turnoverCard.className = "table-card";
  const turnoverHtml = turnoverRows.slice(0, 10).map(function (r) {
    const cls = deltaClass(r.change);
    return '<tr>' +
      '<td>' + r.code + '<div class="name">' + r.name + '</div></td>' +
      '<td class="num">' + fmtNum(r.close, 2) + '</td>' +
      '<td class="num ' + cls + '">' + fmtPct(r.change_pct) + '</td>' +
      '<td class="num">' + fmtInt((r.value_twd || 0) / 1e6) + '</td>' +
      '</tr>';
  }).join("");
  turnoverCard.innerHTML =
    '<h3>成交值居前</h3>' +
    '<table><thead><tr><th>代號／名稱</th><th>收盤</th><th>漲跌幅</th><th>成交值(百萬)</th></tr></thead>' +
    '<tbody>' + turnoverHtml + '</tbody></table>';
  tableGrid.appendChild(turnoverCard);

  // Holdings — P&L calibrated against the user's actual 庫存 statement:
  // cost is the raw shares×avg_cost (no buy-side fee), market value shown
  // is the raw shares×price, and only the P&L nets out the sell-side
  // brokerage commission (full rate, no discount) and transaction tax.
  const COMMISSION_RATE = 0.001425; // 手續費 1.425‰（未打折）
  const ETF_TAX_RATE = 0.001;   // 證券交易税：ETF 0.1%
  const STOCK_TAX_RATE = 0.003; // 證券交易税：一般股票 0.3%
  function isEtfCode(code) { return /^00/.test(code); }
  function floorFee(amount) { return Math.floor(amount * COMMISSION_RATE); }

  const holdingsCard = document.getElementById("holdings-card");
  const holdingsList = HOLDINGS.holdings || [];
  document.getElementById("holdings-updated").textContent =
    HOLDINGS.updated_at ? "更新於 " + HOLDINGS.updated_at : "";
  if (!holdingsList.length) {
    holdingsCard.innerHTML = '<p class="holdings-empty">尚未設定持股，告訴 Claude 你的持股代號、股數與均價即可加入。</p>';
  } else {
    const priceByCode = {};
    (POSTMARKET.watchlist && POSTMARKET.watchlist.matches || []).forEach(function (r) {
      priceByCode[r.code] = r;
    });
    let totalCost = 0, totalValue = 0, totalPnl = 0;
    const rowsHtml = holdingsList.map(function (h) {
      const quote = priceByCode[h.code];
      const price = quote ? quote.close : null;
      const cost = h.shares * h.avg_cost;
      let value = null, pnl = null, pnlPct = null;
      if (price !== null) {
        value = h.shares * price;
        const taxRate = isEtfCode(h.code) ? ETF_TAX_RATE : STOCK_TAX_RATE;
        const netValue = value - floorFee(value) - Math.floor(value * taxRate);
        pnl = netValue - cost;
        pnlPct = cost > 0 ? (pnl / cost * 100) : null;
      }
      totalCost += cost;
      totalValue += value !== null ? value : cost;
      totalPnl += pnl !== null ? pnl : 0;
      const cls = deltaClass(pnl);
      return '<tr>' +
        '<td>' + h.code + (quote ? '<div class="name">' + quote.name + '</div>' : '') + '</td>' +
        '<td class="num">' + fmtInt(h.shares) + '</td>' +
        '<td class="num">' + fmtNum(h.avg_cost, 2) + '</td>' +
        '<td class="num">' + (price !== null ? fmtNum(price, 2) : "N/A") + '</td>' +
        '<td class="num ' + cls + '">' + (pnl !== null ? (pnl > 0 ? "+" : "") + fmtInt(pnl) : "N/A") + '</td>' +
        '<td class="num ' + cls + '">' + (pnlPct !== null ? fmtPct(pnlPct) : "N/A") + '</td>' +
        '</tr>';
    }).join("");
    const totalPnlPct = totalCost > 0 ? (totalPnl / totalCost * 100) : null;
    const totalCls = deltaClass(totalPnl);
    holdingsCard.innerHTML =
      '<div class="holdings-summary">' +
      '<div class="holdings-stat">總成本<b class="num">NT$' + fmtInt(totalCost) + '</b></div>' +
      '<div class="holdings-stat">總市值<b class="num">NT$' + fmtInt(totalValue) + '</b></div>' +
      '<div class="holdings-stat">未實現損益<b class="num ' + totalCls + '">' + (totalPnl > 0 ? "+" : "") + fmtInt(totalPnl) +
      (totalPnlPct !== null ? '　(' + fmtPct(totalPnlPct) + ')' : '') + '</b></div>' +
      '</div>' +
      '<p class="holdings-note">損益已扣除賣出手續費（1.425‰）與證交税（ETF 0.1%／個股 0.3%）；市值為現價×股數原始金額，未扣費用</p>' +
      '<table><thead><tr><th>代號／名稱</th><th>股數</th><th>均價</th><th>現價</th><th>損益</th><th>損益%</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table>';
  }

  // Deep research report
  document.getElementById("report-title").textContent = REPORT_META.title || "完整研究報告";
  document.getElementById("report-updated").textContent =
    REPORT_META.as_of ? "更新於 " + REPORT_META.as_of : "尚未產生";
  if (!REPORT_META.as_of) {
    document.getElementById("report-content").innerHTML =
      '<p class="report-empty">深度研究報告尚未產生，將於下次排程執行後顯示。</p>';
  }
</script>
