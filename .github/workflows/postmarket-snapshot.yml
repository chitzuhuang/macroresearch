name: Post-market snapshot

on:
  schedule:
    # 05:35 UTC = 13:35 Asia/Taipei, weekdays — shortly after TWSE/TPEx close (13:30)
    - cron: "35 5 * * 1-5"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official-latest market snapshot
        run: python3 scripts/fetch_market_snapshot.py --output state/postmarket.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/postmarket.json
          if git diff --cached --quiet; then
            echo "No change in postmarket.json, skipping commit."
          else
            git commit -m "盤後快照更新 $(date -u +%Y-%m-%d)"
            git push
          fi
